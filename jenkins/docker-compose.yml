services:
  jenkins:
    build: .
    image: jenkins-potter:lts
    container_name: jenkins-potter
    ports:
      - "8080:8080"
    environment:
      JAVA_OPTS: >-
        -Djenkins.install.runSetupWizard=false
        -Dhudson.plugins.git.GitSCM.ALLOW_LOCAL_CHECKOUT=true
      # Credenciales del admin: se leen de jenkins/.env (no se sube a git)
      JENKINS_ADMIN_ID: ${JENKINS_ADMIN_ID:?Define JENKINS_ADMIN_ID en jenkins/.env}
      JENKINS_ADMIN_PASSWORD: ${JENKINS_ADMIN_PASSWORD:?Define JENKINS_ADMIN_PASSWORD en jenkins/.env}
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    group_add:
      - "0"
    restart: unless-stopped

volumes:
  jenkins_home:
