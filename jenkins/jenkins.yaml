jenkins:
  systemMessage: "Jenkins CI - Potter Academy"
  numExecutors: 2
  securityRealm:
    local:
      allowsSignup: false
      users:
        # Valores inyectados desde jenkins/.env a través de docker-compose
        - id: "${JENKINS_ADMIN_ID}"
          password: "${JENKINS_ADMIN_PASSWORD}"
  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false

unclassified:
  location:
    url: "http://localhost:8080/"
