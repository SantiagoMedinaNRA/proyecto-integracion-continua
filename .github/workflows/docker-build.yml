name: Docker Build & Validation

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    name: Build & Validate Docker Images

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0'

      - name: Restore dependencies
        run: dotnet restore

      - name: Run Unit Tests
        run: dotnet test Tests/Api.UnitTests/Api.UnitTests.csproj --verbosity minimal --logger "console;verbosity=detailed"
        env:
          DOTNET_CLI_TELEMETRY_OPTOUT: 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate docker-compose.yml syntax
        run: |
          docker compose --env-file .env.ci config > /dev/null
          echo "✓ docker-compose.yml is valid"

      - name: Build Api Docker image
        run: |
          docker build \
            -f Api/Dockerfile \
            -t potter-api:1.0 \
            --progress=plain \
            .
          echo "✓ Api image built successfully"
          docker images potter-api:1.0

      - name: Build Web Docker image
        run: |
          docker build \
            -f Web/Dockerfile \
            -t potter-web:1.0 \
            --progress=plain \
            .
          echo "✓ Web image built successfully"
          docker images potter-web:1.0

      - name: Validate full docker-compose configuration
        run: |
          docker compose --env-file .env.ci config > /dev/null
          echo "✓ Full docker-compose configuration is valid"

      - name: Check image sizes
        run: |
          echo "=== Image Sizes ==="
          docker images potter-api:1.0 --format="table {{.Repository}}:{{.Tag}}\t{{.Size}}"
          docker images potter-web:1.0 --format="table {{.Repository}}:{{.Tag}}\t{{.Size}}"
          echo ""
          echo "✓ Images built and validated"

      - name: List built images
        if: always()
        run: |
          echo "=== Built Docker Images ==="
          docker images --filter "reference=potter*" --format "table {{.Repository}}:{{.Tag}}\t{{.Size}}" || true

      - name: Cleanup
        if: always()
        run: |
          echo "Cleaning up built images..."
          docker rmi potter-api:1.0 potter-web:1.0 || true
          echo "✓ Cleanup completed"

  summary:
    runs-on: ubuntu-latest
    needs: validate-and-build
    if: always()
    name: Build Summary

    steps:
      - name: Build Status
        run: |
          if [ "${{ needs.validate-and-build.result }}" == "success" ]; then
            echo "✅ All validations passed!"
            echo "- Unit Tests: ✓ Passed"
            echo "- docker-compose.yml syntax: ✓ Valid"
            echo "- Api Docker image: ✓ Built"
            echo "- Web Docker image: ✓ Built"
            echo "- Configuration: ✓ Valid"
          else
            echo "❌ Build validation failed!"
            exit 1
          fi
